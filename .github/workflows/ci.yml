# Continuous Integration workflow for the Rehearsal_Forecast_Application.
#
# Purpose: validate the .NET build, unit tests, published output, container
# image build, and Terraform configuration on every pull request and push.
#
# This workflow deliberately does NOT:
#   - Push the container image to any registry
#   - Run `terraform apply`
#   - Authenticate to Google Cloud (no `gcloud auth`, no service account key,
#     no workload identity federation invocation)
#   - Deploy anything to Cloud Run
#
# See .github/workflows/README.md for where a future `deploy.yml` would live
# and for the intended future authentication mechanism (GitHub workload
# identity federation).
#
# Requirements: 24.1, 24.2, 24.3, 24.4, 24.5, 24.6, 24.7, 24.8
# Design: §17.1, §17.2, §17.3, §17.4

name: CI

on:
  pull_request:
  push:

jobs:
  # Job A: .NET restore / build / test / publish + Docker image build.
  # Runs without any cloud credentials (Requirement 24.7).
  dotnet-build-test:
    name: .NET build, test, publish, docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish web application
        run: dotnet publish src/RehearsalForecast.Web -c Release -o publish/

      # Build the container image only. The image is NOT pushed anywhere
      # in this phase (Requirement 24.5). A future `deploy.yml` will handle
      # authenticated pushes to Artifact Registry.
      - name: Docker build (no push)
        run: docker build -t rehearsal-forecast:${{ github.sha }} .

      - name: Upload published web app
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/test-results.trx'
          if-no-files-found: error

  # Job B: Terraform format check, init (no backend), and validate.
  # Runs without any cloud credentials (Requirement 24.7). No `terraform
  # apply` and no state backend are used.
  terraform-validate:
    name: Terraform fmt / init / validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: terraform fmt -check -recursive
        run: terraform -chdir=infrastructure/terraform/environments/dev fmt -check -recursive

      - name: terraform init (backend=false)
        run: terraform -chdir=infrastructure/terraform/environments/dev init -backend=false

      - name: terraform validate
        run: terraform -chdir=infrastructure/terraform/environments/dev validate
